name: "Terraform Pipeline"

on:
  pull_request:
  push:
    branches:
      - master

env:
  TERRAFORM_VERSION: "1.15.2"
  SOPS_VERSION: "3.13.1"
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::326614947945:role/aws-terraform-github-role"
  TF_IN_AUTOMATION: 1

permissions:
  id-token: write
  contents: write # Ensure that the workflow has permission to write to PR comments
  pull-requests: write

jobs:
  quality:
    name: "Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  pr-check:
    name: "Terraform PR Check"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Install SOPS
        run: |
          curl -sSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Configure SOPS age key
        run: |
          umask 077
          printf '%s\n' "$SOPS_AGE_KEY" > "$RUNNER_TEMP/sops-age-key.txt"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Module Tests
        run: TERRAFORM_TEST_INIT=1 make test

      - name: Terraform Plan
        id: plan
        env:
          SOPS_AGE_KEY_FILE: ${{ runner.temp }}/sops-age-key.txt
        run: sops exec-file --output-type binary --filename terraform.tfvars secrets.enc.yaml 'terraform plan -no-color -input=false -var-file {}'

      - name: Submit PR Comment
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: "${{ steps.plan.outputs.stdout }}"
          COMMENT_TITLE: "${{ github.workflow }}"
          COMMENT_AUTHOR: "${{ github.actor }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/js/terraform-comment.js');
            await script({github, context});

  deploy:
    name: "Terraform Deploy"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Install SOPS
        run: |
          curl -sSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Configure SOPS age key
        run: |
          umask 077
          printf '%s\n' "$SOPS_AGE_KEY" > "$RUNNER_TEMP/sops-age-key.txt"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Apply
        env:
          SOPS_AGE_KEY_FILE: ${{ runner.temp }}/sops-age-key.txt
        run: sops exec-file --output-type binary --filename terraform.tfvars secrets.enc.yaml 'terraform apply -auto-approve -input=false -var-file {}'
